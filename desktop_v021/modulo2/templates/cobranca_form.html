{% extends 'base.html' %}
{% block content %}
<section class="panel form-panel"><h2>Cobrança avulsa — demonstração</h2><p class="muted">Cadastre uma conta fictícia para testar alertas de inadimplência.</p><form method="post" action="/financeiro/nova" class="form-grid"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="field wide"><label for="cli">Cliente *</label><select id="cli" name="cliente_id" required><option value="">Selecione</option>{% for c in clientes %}<option value="{{ c.id }}" {% if data.get('cliente_id') == c.id|string %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select></div><div class="field wide"><label for="desc">Descrição *</label><input id="desc" name="descricao" required maxlength="160" value="{{ data.get('descricao','') }}" placeholder="Ex.: Pedido de teste pendente"></div><div class="field"><label for="valor">Valor (R$) *</label><input id="valor" name="valor" required value="{{ data.get('valor','') }}" placeholder="Ex.: 125,50"></div><div class="field"><label for="venc">Vencimento *</label><input type="date" id="venc" name="vencimento" required value="{{ data.get('vencimento','') }}"></div><div class="actions wide"><button type="submit" class="button primary">Salvar cobrança</button><a class="button secondary" href="/financeiro">Cancelar</a></div></form></section>
{% endblock %}
