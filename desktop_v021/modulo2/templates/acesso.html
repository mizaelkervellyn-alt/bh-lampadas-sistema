{% extends 'base.html' %}
{% block content %}
<section class="panel auth-card">
 {% if setup %}<h2>Configurar acesso inicial</h2><p>Escolha uma senha de pelo menos 10 caracteres. Ela ficará protegida no banco local.</p>
 <form method="post" action="/configurar" class="form-stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="nome">Seu nome</label><input id="nome" name="nome" required minlength="2" autocomplete="name">
  <label for="senha">Crie uma senha</label><input id="senha" name="senha" type="password" minlength="10" required autocomplete="new-password">
  <button class="button primary" type="submit">Criar acesso</button>
 </form>
 {% else %}<h2>Entrar no sistema</h2><p>Os dados ficam apenas neste computador.</p>
 <form method="post" action="/entrar" class="form-stack">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="login">Usuário</label><input id="login" name="login" value="admin" required autocomplete="username">
  <label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password">
  <button class="button primary" type="submit">Entrar</button>
 </form>{% endif %}
</section>
{% endblock %}
